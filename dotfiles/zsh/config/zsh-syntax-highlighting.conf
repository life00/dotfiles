# Catppuccin Theme (for zsh-syntax-highlighting)
#
ZSH_HIGHLIGHT_HIGHLIGHTERS=(main cursor)
typeset -gA ZSH_HIGHLIGHT_STYLES

# Main highlighter styling: https://github.com/zsh-users/zsh-syntax-highlighting/blob/master/docs/highlighters/main.md

# italic, bold, underlined, fg, bg

ZSH_HIGHLIGHT_STYLES[unknown-token]="fg=#ed8796"
ZSH_HIGHLIGHT_STYLES[reserved-word]="fg=#8bd5ca"
ZSH_HIGHLIGHT_STYLES[alias]="fg=#f4dbd6"
ZSH_HIGHLIGHT_STYLES[suffix-alias]="fg=#f4dbd6"
ZSH_HIGHLIGHT_STYLES[global-alias]="fg=#f4dbd6"
ZSH_HIGHLIGHT_STYLES[builtin]="fg=#f0c6c6"
ZSH_HIGHLIGHT_STYLES[function]="fg=#f5bde6"
ZSH_HIGHLIGHT_STYLES[command]="fg=#f0c6c6"
ZSH_HIGHLIGHT_STYLES[precommand]="fg=#c6a0f6,underline"
ZSH_HIGHLIGHT_STYLES[commandseparator]="fg=#8aadf4"
ZSH_HIGHLIGHT_STYLES[hashed-command]="fg=f0c6c6"
# ZSH_HIGHLIGHT_STYLES[autodirectory]="?" # no idea what this is
ZSH_HIGHLIGHT_STYLES[path]="fg=#b7bdf8,underline"
ZSH_HIGHLIGHT_STYLES[path_prefix]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[path_prefix_pathseparator]="fg=#b7bdf8,bold"
ZSH_HIGHLIGHT_STYLES[globbing]="fg=#c6a0f6"
# ZSH_HIGHLIGHT_STYLES[history-expansion]="?" # no idea what this is
ZSH_HIGHLIGHT_STYLES[command-substitution]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[command-substitution-unquoted]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[command-substitution-quoted]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[command-substitution-delimiter]="fg=#7dc4e4"
ZSH_HIGHLIGHT_STYLES[command-substitution-delimiter-unquoted]="fg=#7dc4e4"
ZSH_HIGHLIGHT_STYLES[command-substitution-delimiter-quoted]="fg=#7dc4e4"
# ZSH_HIGHLIGHT_STYLES[process-substitution]="?" # no idea what this is
# ZSH_HIGHLIGHT_STYLES[process-substitution-delimiter]="?" # no idea what this is
ZSH_HIGHLIGHT_STYLES[arithmetic-expansion]="fg=#7dc4e4"
ZSH_HIGHLIGHT_STYLES[single-hyphen-option]="fg=#eed49f"
ZSH_HIGHLIGHT_STYLES[double-hyphen-option]="fg=#eed49f"
ZSH_HIGHLIGHT_STYLES[back-quoted-argument]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[back-quoted-argument-unclosed]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[back-quoted-argument-delimiter]="fg=#8bd5ca"
ZSH_HIGHLIGHT_STYLES[single-quoted-argument]="fg=#8bd5ca"
ZSH_HIGHLIGHT_STYLES[single-quoted-argument-unclosed]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[double-quoted-argument]="fg=#8bd5ca"
ZSH_HIGHLIGHT_STYLES[double-quoted-argument-unclosed]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[dollar-quoted-argument]="fg=#8bd5ca"
ZSH_HIGHLIGHT_STYLES[dollar-quoted-argument-unclosed]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[rc-quote]="fg=#8bd5ca"
ZSH_HIGHLIGHT_STYLES[dollar-double-quoted-argument]="fg=#a6da95"
ZSH_HIGHLIGHT_STYLES[back-double-quoted-argument]="fg=#cad3f5"
ZSH_HIGHLIGHT_STYLES[assign]="fg=#f5a97f"
ZSH_HIGHLIGHT_STYLES[redirection]="fg=#8aadf4"
ZSH_HIGHLIGHT_STYLES[comment]="fg=494d64"
ZSH_HIGHLIGHT_STYLES[default]="fg=cad3f5"
